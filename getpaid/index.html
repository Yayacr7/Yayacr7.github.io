<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GetPaid</title>
<meta name="description" content="Talk about the job you just finished and get a draft invoice or quote. Track who has paid and send polite follow-ups you approve first. Built for mobile detailers.">
<meta name="theme-color" content="#F3F4EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1210" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GetPaid">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap">
<style>
:root{
  --bg:#F3F4EF; --surf:#FFFFFF; --surf2:#EDEFE8; --line:rgba(20,32,26,.10); --line2:rgba(20,32,26,.18);
  --ink:#14201A; --dim:#56625B; --faint:#7C877F;
  --acc:#0E7A4E; --acc-ink:#FFFFFF; --acc-soft:#E2F2E9; --acc-text:#0B6340;
  --warn:#9A4A06; --warn-soft:#FDF0E1; --bad:#B42318; --bad-soft:#FDECEA; --info:#1D4ED8; --info-soft:#E6EDFD;
  --shadow:0 1px 2px rgba(20,32,26,.06),0 6px 20px -8px rgba(20,32,26,.18);
  --head:Manrope,Inter,system-ui,-apple-system,"Segoe UI",sans-serif; --sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:16px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1210; --surf:#151C18; --surf2:#1C2520; --line:rgba(230,240,234,.09); --line2:rgba(230,240,234,.17);
  --ink:#EEF3EF; --dim:#A6B2AA; --faint:#7F8B83;
  --acc:#3DDC97; --acc-ink:#05251A; --acc-soft:rgba(61,220,151,.12); --acc-text:#5BE3A8;
  --warn:#F5B060; --warn-soft:rgba(245,176,96,.12); --bad:#F7867B; --bad-soft:rgba(247,134,123,.12); --info:#8DB0FF; --info-soft:rgba(141,176,255,.12);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -10px rgba(0,0,0,.6); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D1210; --surf:#151C18; --surf2:#1C2520; --line:rgba(230,240,234,.09); --line2:rgba(230,240,234,.17);
  --ink:#EEF3EF; --dim:#A6B2AA; --faint:#7F8B83;
  --acc:#3DDC97; --acc-ink:#05251A; --acc-soft:rgba(61,220,151,.12); --acc-text:#5BE3A8;
  --warn:#F5B060; --warn-soft:rgba(245,176,96,.12); --bad:#F7867B; --bad-soft:rgba(247,134,123,.12); --info:#8DB0FF; --info-soft:rgba(141,176,255,.12);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -10px rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--sans);min-height:100vh;min-height:100dvh;overflow-x:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--acc-text)}
h1,h2,h3{font-family:var(--head);letter-spacing:-.015em;margin:0}
.num{font-family:var(--head);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.wrap{max-width:520px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom));padding-top:env(safe-area-inset-top)}
.wrap.nonav{padding-bottom:calc(32px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:10px;min-height:56px;padding:10px 0 4px}
.top h1{font-size:1.2rem;font-weight:800;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .sub{color:var(--dim);font-size:.82rem}
.back{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surf);display:grid;place-items:center;flex:none}
.back svg{width:20px;height:20px}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.brand img{width:34px;height:34px;border-radius:10px}
.brand b{font:800 1.15rem/1 var(--head)}
.brand span{display:block;color:var(--dim);font-size:.78rem;margin-top:2px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.card h2{font-size:1rem;font-weight:700;margin-bottom:8px}
.label{font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--faint)}
.muted{color:var(--dim)} .small{font-size:.84rem} .tiny{font-size:.76rem}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:14px;border:1px solid var(--line2);background:var(--surf);font-weight:600;text-decoration:none;color:var(--ink)}
.btn.pri{background:var(--acc);color:var(--acc-ink);border-color:transparent}
.btn.soft{background:var(--acc-soft);color:var(--acc-text);border-color:transparent}
.btn.ghost{background:none;border-color:transparent;color:var(--dim)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft);background:var(--bad-soft)}
.btn.full{width:100%}
.btn.sm{min-height:38px;padding:0 12px;border-radius:11px;font-size:.88rem}
.btn svg{width:18px;height:18px;flex:none}
.btn:disabled{opacity:.45;cursor:default}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btns.three{grid-template-columns:1fr 1fr 1fr}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--surf2);color:var(--dim);white-space:nowrap}
.pill.draft{background:var(--surf2);color:var(--dim)}
.pill.sent,.pill.waiting{background:var(--info-soft);color:var(--info)}
.pill.partly,.pill.approved,.pill.invoiced{background:var(--acc-soft);color:var(--acc-text)}
.pill.overdue,.pill.expired{background:var(--warn-soft);color:var(--warn)}
.pill.paid{background:var(--acc);color:var(--acc-ink)}
.pill.declined{background:var(--bad-soft);color:var(--bad)}
.field{display:block;margin:10px 0}
.field>span{display:block;font-size:.8rem;font-weight:600;color:var(--dim);margin-bottom:5px}
.in{width:100%;min-height:46px;padding:10px 12px;border-radius:12px;border:1px solid var(--line2);background:var(--surf);outline:none;font-size:16px}
.in:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
textarea.in{resize:vertical;min-height:90px;line-height:1.45}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.two>*{min-width:0}
input[type=date].in{-webkit-appearance:none;appearance:none;min-width:0;max-width:100%}
.seg{display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surf2);border-radius:12px;padding:3px;gap:3px;width:100%}
.seg button{border:0;background:none;min-height:40px;border-radius:9px;font-weight:600;color:var(--dim);font-size:.9rem}
.seg button.on{background:var(--surf);color:var(--ink);box-shadow:var(--shadow)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:var(--surf);border-radius:99px;min-height:36px;padding:0 13px;font-size:.86rem;font-weight:500;color:var(--dim)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{flex:none}
/* home */
.sum{background:linear-gradient(150deg,#0E7A4E,#0A5B3A);color:#fff;border:0}
:root[data-theme="dark"] .sum{background:linear-gradient(150deg,#15513A,#0F3527)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .sum{background:linear-gradient(150deg,#15513A,#0F3527)}}
.sum .label{color:rgba(255,255,255,.72)}
.sum .big{font:800 2.4rem/1.05 var(--head);letter-spacing:-.02em;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.sum .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.16)}
.sum .stats b{display:block;font:700 1.05rem var(--head);font-variant-numeric:tabular-nums}
.sum .stats span{font-size:.76rem;color:rgba(255,255,255,.75)}
.talk{text-decoration:none;color:inherit;display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:1px solid var(--line);background:var(--surf);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);margin:12px 0}
.talk .mic{width:56px;height:56px;border-radius:50%;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;flex:none}
.talk .mic svg{width:26px;height:26px}
.talk b{font:700 1.05rem var(--head);display:block}
.talk>span:last-child{color:var(--ink)}
.talk span span{color:var(--dim);font-size:.84rem}
.list{list-style:none;margin:0;padding:0}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);text-decoration:none;color:inherit;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.list li:first-child .item{border-top:0}
.item .av{width:40px;height:40px;border-radius:12px;background:var(--surf2);display:grid;place-items:center;font:700 .9rem var(--head);color:var(--dim);flex:none}
.item .av.warn{background:var(--warn-soft);color:var(--warn)} .item .av.go{background:var(--acc-soft);color:var(--acc-text)} .item .av.info{background:var(--info-soft);color:var(--info)}
.item .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{font-size:.8rem;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .amt{text-align:right;flex:none}
.item .amt b{display:block;font:700 .98rem var(--head);font-variant-numeric:tabular-nums}
.empty{text-align:center;padding:26px 10px;color:var(--dim)}
.empty b{display:block;color:var(--ink);font:700 1rem var(--head);margin-bottom:4px}
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--warn-soft);color:var(--warn);font-size:.86rem;margin:12px 0}
.banner a{color:inherit;font-weight:700}
.banner.info{background:var(--info-soft);color:var(--info)}
.banner svg{width:18px;height:18px;flex:none;margin-top:1px}
/* record */
.rec{text-align:center;padding:8px 0}
.micbig{position:relative;width:132px;height:132px;border-radius:50%;border:0;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;margin:18px auto 12px;box-shadow:0 14px 34px -12px var(--acc)}
.micbig svg{width:48px;height:48px}
.micbig.on{background:var(--bad);color:#fff;box-shadow:0 14px 34px -12px var(--bad)}
.micbig.on::before,.micbig.on::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:2px solid var(--bad);opacity:.5;animation:ring 1.6s ease-out infinite}
.micbig.on::after{animation-delay:.8s}
@keyframes ring{from{transform:scale(.9);opacity:.6}to{transform:scale(1.35);opacity:0}}
.micstate{font:700 1.05rem var(--head)}
.say{font-size:.86rem;color:var(--dim);max-width:380px;margin:6px auto 0}
.examples{margin-top:10px}
/* draft */
.checks{background:var(--warn-soft);color:var(--warn);border-radius:14px;padding:12px 14px;margin:12px 0;font-size:.88rem}
.checks b{display:block;margin-bottom:4px}
.checks ul,.heard ul{margin:0;padding-left:18px}
.heard{font-size:.86rem;color:var(--dim)}
.heard summary{cursor:pointer;font-weight:600;color:var(--ink);min-height:32px;display:flex;align-items:center}
.heard q{display:block;font-style:italic;margin:6px 0 8px;padding:8px 10px;border-left:3px solid var(--line2);background:var(--surf2);border-radius:0 8px 8px 0;quotes:none}
.line{border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0;background:var(--surf)}
.line .lr{display:grid;grid-template-columns:64px 1fr auto 40px;gap:8px;align-items:center;margin-top:8px}
.line .lt{font:700 .95rem var(--head);text-align:right;font-variant-numeric:tabular-nums;min-width:74px}
.line .why{font-size:.74rem;color:var(--faint);margin-top:6px}
.x{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--faint);display:grid;place-items:center}
.x svg{width:16px;height:16px}
.money-in{position:relative}
.money-in::before{content:"$";position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--faint);pointer-events:none}
.money-in .in{padding-left:22px}
.tot{display:grid;gap:4px;font-size:.92rem}
.tot div{display:flex;justify-content:space-between}
.tot .grand{font:800 1.15rem var(--head);border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
.savebar{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line);z-index:20}
.savebar .in2{max-width:520px;margin:0 auto;display:flex;gap:10px;align-items:center}
.savebar .tt{flex:1;min-width:0}
.savebar .tt b{display:block;font:800 1.1rem var(--head);font-variant-numeric:tabular-nums}
.err{color:var(--bad);font-size:.84rem;margin-top:6px}
/* doc */
.hero{padding:6px 0 2px}
.hero .amt{font:800 2.3rem/1.05 var(--head);letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin:6px 0 2px}
.next{border:1px solid var(--acc);background:var(--acc-soft)}
.next.warn{border-color:var(--warn);background:var(--warn-soft)}
.next p{margin:4px 0 12px;font-size:.9rem;color:var(--dim)}
.paper{background:#fff;color:#1a1a1a;border-radius:14px;padding:20px 18px;box-shadow:var(--shadow);border:1px solid rgba(0,0,0,.08);font-size:13px;line-height:1.45;margin:12px 0}
.paper .ph{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;border-bottom:2px solid #111;padding-bottom:12px;margin-bottom:12px}
.paper .biz{font:800 1.05rem var(--head);color:#111}
.paper .kind{font:800 1.2rem var(--head);letter-spacing:.04em;text-align:right;color:#111}
.paper .meta{color:#555;font-size:12px}
.paper table{width:100%;border-collapse:collapse;margin:10px 0}
.paper th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#666;border-bottom:1px solid #ddd;padding:6px 0}
.paper td{padding:7px 0;border-bottom:1px solid #eee;vertical-align:top}
.paper .r{text-align:right;white-space:nowrap;padding-left:8px}
.paper .pt{margin-left:auto;width:min(240px,100%)}
.paper .pt div{display:flex;justify-content:space-between;padding:2px 0}
.paper .pt .g{font-weight:800;font-size:15px;border-top:2px solid #111;margin-top:4px;padding-top:6px}
.paper .pay{margin-top:14px;padding:10px 12px;background:#f4f6f3;border-radius:8px;font-size:12px}
.paper .stamp{display:inline-block;border:2px solid #0E7A4E;color:#0E7A4E;font:800 12px var(--head);letter-spacing:.12em;padding:3px 8px;border-radius:6px;transform:rotate(-4deg)}
.hist{list-style:none;padding:0;margin:0;font-size:.86rem}
.hist li{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line);align-items:center}
.hist li:first-child{border-top:0}
.hist .d{color:var(--faint);font-size:.78rem;width:62px;flex:none}
.hist .g{flex:1;min-width:0}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(5,10,8,.45);z-index:40;opacity:0;transition:opacity .2s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:92vh;max-height:92dvh;overflow:auto;background:var(--surf);border-radius:22px 22px 0 0;padding:8px 16px calc(18px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);max-width:560px;margin:0 auto;overscroll-behavior:contain}
.sheet.on{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--line2);margin:4px auto 10px}
.sheet h2{font-size:1.15rem;font-weight:800;margin-bottom:4px}
.note{font-size:.78rem;color:var(--faint);margin-top:10px}
/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--surf) 92%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav .in2{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;height:64px}
.nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:64px;text-decoration:none;color:var(--faint);font-size:.7rem;font-weight:600;position:relative}
.nav a svg{width:22px;height:22px}
.nav a.on{color:var(--ink)}
.nav a.on svg{color:var(--acc)}
.nav .fab{width:58px;height:58px;border-radius:50%;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;margin:0 auto 10px;box-shadow:0 10px 24px -8px var(--acc)}
.nav .fab svg{width:26px;height:26px;color:var(--acc-ink)!important}
.badge{position:absolute;top:8px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:.68rem;display:grid;place-items:center;padding:0 5px}
.toast{pointer-events:none;position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:600;font-size:.9rem;z-index:60;opacity:0;transition:all .2s;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.welcome{min-height:calc(100dvh - 40px);display:flex;flex-direction:column;justify-content:center;padding:24px 0}
.welcome h1{font-size:2rem;font-weight:800;line-height:1.1;margin:18px 0 10px}
.steps3{display:grid;gap:10px;margin:18px 0 22px;counter-reset:s}
.steps3 div{display:flex;gap:12px;align-items:flex-start;background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:12px}
.steps3 div::before{counter-increment:s;content:counter(s);width:28px;height:28px;border-radius:50%;background:var(--acc-soft);color:var(--acc-text);display:grid;place-items:center;font:800 .85rem var(--head);flex:none}
.svc{display:grid;grid-template-columns:1fr 92px 92px;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.svc .in{min-height:42px}
.svc.head{border-top:0;font-size:.72rem;color:var(--faint);font-weight:600;text-transform:uppercase;letter-spacing:.05em;padding-bottom:0}
.svcw{grid-column:1/-1}
.visually-hidden{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media (min-width:700px){.wrap{padding-top:14px}}
@media print{
  body{background:#fff}
  body *{visibility:hidden}
  .paper,.paper *{visibility:visible}
  .paper{position:absolute;left:0;top:0;width:100%;box-shadow:none;border:0;margin:0}
}
</style>
</head>
<body>
<a class="visually-hidden" href="#main">Skip to content</a>
<div id="app"></div>
<div id="sheetroot"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:20px">GetPaid needs JavaScript turned on.</p></noscript>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
