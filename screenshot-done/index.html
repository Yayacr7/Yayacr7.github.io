<meta name="theme-color" content="#FFFBF5">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<div class="shell">

    <a href="#/settings" data-nav="settings"><svg><use href="#i-gear"/></svg><span>Settings</span></a>

  <main id="view" tabindex="-1"></main>
</div>

<div class="drop" id="drop" aria-hidden="true"><div><svg><use href="#i-image"/></svg>Drop the screenshot</div></div>
