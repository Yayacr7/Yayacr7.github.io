<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Screenshot → Done ad (square)</title>
<!-- Source for promo/ad-square.png. Render at 627x627, deviceScaleFactor 2.
     app-review.png is a real screen from the app; coach-text.png is a made-up sample message. -->
<style>
*{box-sizing:border-box}
body{margin:0;width:627px;height:627px;overflow:hidden;font-family:-apple-system,"SF Pro Display","Segoe UI",Roboto,Arial,sans-serif;color:#fff;
 background:radial-gradient(90% 70% at 100% 0%,#3D6BFF 0%,rgba(61,107,255,0) 60%),radial-gradient(70% 60% at 0% 100%,#FF6B57 0%,rgba(255,107,87,0) 55%),linear-gradient(150deg,#7C3AED 0%,#5B21B6 55%,#2D3FD6 100%);
 display:flex;flex-direction:column;padding:28px 30px 10px}
.brand{display:flex;align-items:center;gap:11px;font-weight:800;font-size:20px;letter-spacing:-.01em}
.brand img{width:42px;height:42px;border-radius:11px;box-shadow:0 6px 16px rgba(0,0,0,.25)}
.main{display:flex;gap:18px;margin-top:18px;flex:1;min-height:0}
.left{flex:1;min-width:0;position:relative}
h1{margin:0;font-size:37px;line-height:1.05;letter-spacing:-.03em;font-weight:850}
h1 span{color:#FFB3A6}
.sub{margin:10px 0 0;font-size:16px;line-height:1.3;color:rgba(255,255,255,.9)}
.shot{position:relative;margin:30px 0 0 4px;width:252px;border-radius:20px;background:#fff;padding:5px;transform:rotate(-4deg);box-shadow:0 18px 40px rgba(20,0,60,.4)}
.shot img{display:block;width:100%;border-radius:16px}
.shot .lab{position:absolute;left:12px;top:-13px;background:#1D1533;color:#fff;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 9px;border-radius:7px}
.arrow{position:absolute;right:-30px;bottom:96px;width:70px;height:50px;z-index:3}
.phone{flex:none;width:222px;height:398px;align-self:flex-start;margin-top:10px;border-radius:38px;background:#16102A;padding:7px;box-shadow:0 26px 50px rgba(20,0,60,.5),inset 0 0 0 2px rgba(255,255,255,.12)}
.screen{width:100%;height:100%;border-radius:31px;overflow:hidden;background:#FFFBF5;position:relative;padding-top:30px}
.screen img{display:block;width:100%;height:100%;object-fit:cover;object-position:top}
.island{position:absolute;left:50%;top:8px;transform:translateX(-50%);width:64px;height:18px;border-radius:12px;background:#16102A}
.status{position:absolute;top:8px;left:20px;right:18px;display:flex;justify-content:space-between;font-size:10px;font-weight:700;color:#1D1533}
.promise{display:flex;gap:7px;justify-content:center;margin-top:14px}
.promise span{font-size:12px;font-weight:650;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.24);padding:5px 10px;border-radius:999px;white-space:nowrap}
.bottom{display:flex;flex-direction:column;align-items:center;margin-top:12px}
.cta{background:#FF6B57;color:#fff;font-weight:800;font-size:19px;padding:11px 28px;border-radius:999px;box-shadow:0 10px 24px rgba(255,107,87,.45);white-space:nowrap}
.foot{margin-top:7px;font-size:9.5px;color:rgba(255,255,255,.7)}
</style></head><body>
<div class="brand"><img src="../icons/icon-180.png" alt="">Screenshot → Done</div>
<div class="main">
 <div class="left">
  <h1>Stop losing plans in your <span>screenshots.</span></h1>
  <p class="sub">Turn screenshots into events, reminders and checklists.</p>
  <div class="shot"><span class="lab">Your screenshot</span><img src="coach-text.png" alt=""></div>
  <svg class="arrow" viewBox="0 0 70 50" fill="none"><path d="M4 42C22 44 42 36 56 14" stroke="#fff" stroke-width="5" stroke-linecap="round"/><path d="M42 12l15-2 2 15" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>
 </div>
 <div class="phone"><div class="screen"><div class="status"><span>9:41</span><span>100%</span></div><div class="island"></div><img src="app-review.png" alt="The app's Check the details screen"></div></div>
</div>
<div class="promise"><span>Read on your phone</span><span>Unsure details marked</span><span>Nothing happens until you confirm</span></div>
<div class="bottom"><div class="cta">Try Screenshot → Done</div><div class="foot">Real app screen · sample message made up</div></div>
</body></html>
